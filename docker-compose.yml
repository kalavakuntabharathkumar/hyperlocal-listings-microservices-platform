services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: listings
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}}
    ports: ["5432:5432"]
  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092"]
  listing-service:
    build: ./listing-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/listings
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on: [postgres, kafka]
    ports: ["8081:8080"]
  spam-worker:
    build: ./spam-worker
    environment: {KAFKA_BOOTSTRAP: kafka:9092}
    depends_on: [kafka]
